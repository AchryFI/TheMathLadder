<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数学阶梯 The Math Ladder</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/break_infinity.js@2"></script>
</head>
<body>
  <div id="app-frame">
  <div id="app">
    <!-- 顶部：货币栏 -->
    <header id="topbar">
      <div id="stage-tabs"></div>
      <div class="currency" id="cur-l1">
        <span class="label">算术币</span>
        <span class="value" id="val-l1">0</span>
        <span class="rate" id="rate-l1">+0/s</span>
      </div>
      <div class="currency" id="cur-l2">
        <span class="label">代数币</span>
        <span class="value" id="val-l2">0</span>
        <span class="rate" id="rate-l2">+0/s</span>
      </div>
      <div class="currency" id="cur-l3">
        <span class="label">函数币</span>
        <span class="value" id="val-l3">0</span>
        <span class="rate" id="rate-l3">+0/s</span>
      </div>
      <div class="currency" id="cur-l4">
        <span class="label">微积分币</span>
        <span class="value" id="val-l4">0</span>
        <span class="rate" id="rate-l4">+0/s</span>
      </div>
      <div class="currency" id="cur-l5">
        <span class="label">抽象币</span>
        <span class="value" id="val-l5">0</span>
        <span class="rate" id="rate-l5">+0/s</span>
      </div>
      <div class="currency" id="cur-l6" style="display:none">
        <span class="label">超限币</span>
        <span class="value" id="val-l6">0</span>
      </div>
    </header>

    <!-- 主区域 -->
    <main id="main">
      <!-- 左：点击 + 当前学段建筑 -->
      <section id="left-panel">
        <div id="click-area">
          <button id="click-btn">写下答案</button>
          <p id="story-line"></p>
        </div>
        <h2 id="stage-title">第一章 · 数</h2>
        <div id="buildings"></div>
      </section>

      <section id="mid-panel">
        <h2>知识点升级</h2>
        <div id="upgrades"></div>
        <div id="k-upgrades-area" style="display:none;">
          <h2>学术升级（k 系数）</h2>
          <p style="font-size:12px;color:#8a8fa3;margin-bottom:8px;">
            当前 k = <span id="k-value">1</span>　成就乘数 = 2^(0.003 × s × k)
          </p>
          <div id="k-upgrades"></div>
        </div>
        <div id="reset-protection-area" style="display:none;">
  <h2>永久加成</h2>
<p style="font-size:12px;color:#8a8fa3;margin-bottom:8px;">
  购买后永久提升本层产出，不随重置消失。<br>
  当前累计 s = <span id="rp-s-total">0</span>，本层乘数 <span id="rp-mult">×1.00</span>
</p>
  <div id="reset-protection-list"></div>
</div>
      </section>

      <!-- 右：重置 / 扬声器 / 成就 -->
      <section id="right-panel">
         <div id="convert-area">
        <h2>转化</h2>
        <p id="convert-info"></p>
        <button id="convert-btn">转化 1 代数币</button>
        <label id="auto-convert-toggle" style="display:none;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:#8a8fa3;cursor:pointer;">
          <input type="checkbox" /> 自动转化到下一层
        </label>
      </div>
        <div id="reset-area">
          <h2>重置</h2>
          <p id="reset-info"></p>
          <button id="reset-btn">重置本学段</button>
        </div>
        <div id="speaker-area">
          <h2>课堂喇叭</h2>
          <p>数量：<span id="speaker-count">0</span></p>
          <p>自动获取：<span id="speaker-auto">0</span>/秒</p>
          <div id="speaker-upgrades"></div>
        </div>
        <div id="achievement-area">
          <h2>成就 <span id="ach-count">0</span>/60</h2>
          <p>L1 乘数：×<span id="ach-mult">1</span></p>
          <div id="achievements"></div>
        </div>
      </section>
    </main>

    <!-- 底部：日志 -->
    <footer id="log"></footer>
    <!-- 帮助按钮 -->
    <button id="story-btn" title="剧情">📖</button>
    <button id="help-btn" title="帮助">?</button>
    <button id="settings-btn" title="设置">⚙</button>
    </div>
    <!-- 帮助弹窗遮罩 -->
    <div id="help-overlay" class="hidden">
      <div id="help-modal">
        <div id="help-header">
          <h2>帮助</h2>
          <button id="help-close">✕</button>
        </div>
        <div id="help-content"></div>
      </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-overlay" class="hidden">
      <div id="settings-modal">
        <div id="settings-header">
          <h2>设置</h2>
          <button id="settings-close">✕</button>
        </div>
        <div id="settings-content">
          <div class="setting-row">
            <label for="tick-rate-slider">刷新速度：<span id="tick-rate-value">100</span> ms</label>
            <input type="range" id="tick-rate-slider" min="20" max="1000" step="10" value="100" />
            <div class="setting-hint">数值越小越流畅，但 CPU 占用越高。推荐 100ms。</div>
          </div>
          <div class="setting-row">
          <label>存档管理</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
            <button id="export-btn" class="setting-btn">导出存档</button>
            <button id="import-btn" class="setting-btn">导入存档</button>
            <button id="clear-save-btn" class="setting-btn danger">重置存档</button>
          </div>
        </div>

        <div class="setting-row">
          <label for="import-textarea">导入存档码</label>
          <textarea id="import-textarea" placeholder="粘贴导出的 base64 存档码..." rows="4"></textarea>
          <div id="import-preview" class="setting-hint"></div>
          <button id="import-confirm-btn" class="setting-btn" style="margin-top:8px;display:none;">确认导入</button>
        </div>

        <div class="setting-row">
          <label for="export-textarea">导出存档码</label>
          <textarea id="export-textarea" placeholder="点击上方「导出存档」生成..." rows="4" readonly></textarea>
          <div id="export-info" class="setting-hint"></div>
        </div>
        </div>
      </div>
    </div>

    <!-- 剧情弹窗 -->
    <div id="story-overlay" class="hidden">
      <div id="story-modal">
        <div id="story-header">
          <h2>剧情回顾</h2>
          <button id="story-close">✕</button>
        </div>
        <div id="story-content"></div>
      </div>
    </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
